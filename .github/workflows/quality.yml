name: Calidad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  sql-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - run: psql -f tests/sql/schema_fixture.sql
      - run: psql -f Rainbows_V3.17.0_seguridad_integral.sql
      - run: psql -f Rainbows_V3.18.1_eliminar_comandas.sql
      - run: psql -f Rainbows_V3.18.2_auditoria_comandas.sql
      - run: psql -f Rainbows_V3.18.3_comandas_pendientes.sql
      - run: psql -f Rainbows_V3.18.5_editar_comandas.sql
      - run: psql -f Rainbows_V3.18.7_stock_mostrador.sql
      - run: psql -v ON_ERROR_STOP=1 -f Rainbows_V3.19.0_stock_medrano.sql
      - run: psql -f tests/sql/schema_assertions.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/stock_medrano_assertions.sql

  cultivation-consumption:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/cultivation-consumption-fixture.sql
      - run: psql -v ON_ERROR_STOP=1 -f Palestina_V32668_consumo_enmiendas.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/cultivation-consumption-assertions.sql

  croquis-rooms:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/croquis-rooms-fixture.sql
      - run: psql -v ON_ERROR_STOP=1 -f Palestina_V32669_croquis_salas.sql
      - run: psql -v ON_ERROR_STOP=1 -f Palestina_V32669_croquis_salas.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/croquis-rooms-assertions.sql

  cash-digital-daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/cash-digital-daily-fixture.sql
      - run: psql -v ON_ERROR_STOP=1 -f Rainbows_V3.26.22_arqueo_caja.sql
      - run: psql -v ON_ERROR_STOP=1 -f Rainbows_V3.26.72_caja_digital_diaria.sql
      - run: psql -v ON_ERROR_STOP=1 -f Rainbows_V3.26.72_caja_digital_diaria.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/cash-digital-daily-assertions.sql

  palestina-cash:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/palestina-cash-fixture.sql
      - run: psql -v ON_ERROR_STOP=1 -f Palestina_V32673_administracion_caja.sql
      - run: psql -v ON_ERROR_STOP=1 -f Palestina_V32673_administracion_caja.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/palestina-cash-assertions.sql

